name: 🤖 Dependabot auto-merge

on: [pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  call-auto-merge-workflow:
    if: ${{ github.actor == 'dependabot[bot]' }}
    uses: mikesprague/reusable-workflows/.github/workflows/dependabot-auto-merge.yml@6771c975237a2165e414447932e6487d6d4f245e # main
    secrets:
      REPO_TOKEN: ${{ secrets.GITHUB_TOKEN}}
