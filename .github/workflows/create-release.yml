name: Create Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "!v[0-9]*.[0-9]*.[0-9]*-*"
      - "v[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*"

env:
  # get node version from repo variable or default to 24.x
  NODE_VERSION: ${{ vars.NODE_VERSION  || '24.x' }}

jobs:
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout repo with full history to ensure all tags are available for changelog generation
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🏗️ Setup Bun environment
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: ⚡  Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.setup-bun.outputs.bun-version }}-

      # install conventional changelog dependencies if not cached
      - name: 🏗️ Install dependencies
        if: steps.cache.outputs.cache-hit != 'true' && !cancelled()
        run: bun install conventional-changelog conventional-changelog-conventionalcommits

      # generate and output data for release creation and changelog generation steps
      - name: Prepare release data
        id: prep_release
        shell: bash
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          new_tag="${GITHUB_REF_NAME}"

          if ! [[ "$new_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Tag '$new_tag' is not strict semver (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)."
            exit 1
          fi

          echo "new_tag: $new_tag"

          if [[ "$new_tag" =~ -(alpha|beta|rc)\. ]]; then
            is_prerelease="true"
            core_tag="${new_tag%%-*}"
            last_tag="$(
              git tag --sort=-version:refname \
              | grep -E "^${core_tag//./\\.}-(alpha|beta|rc)\\.[0-9]+$" \
              | sed -n "/^${new_tag//./\\.}$/d; p; q" \
              || true
            )"

            if [[ -z "$last_tag" ]]; then
              last_tag="$(
                git tag --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$' \
                | sed -n "/^${new_tag//./\\.}$/d; p; q" \
                || true
              )"
            fi

            if [[ -z "$last_tag" ]]; then
              last_tag="$(
                git tag --sort=-version:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sed -n "/^${new_tag//./\\.}$/d; p; q" \
                || true
              )"
            fi
          else
            is_prerelease="false"
            last_tag="$(
              git tag --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed -n "/^${new_tag//./\\.}$/d; p; q" \
              || true
            )"
          fi

          echo "last_tag: $last_tag"

          safe_repo="$(printf '%s' "$GITHUB_REPOSITORY_NAME" | tr -d '\n\r')"
          if [[ -n "$last_tag" ]]; then
            full_changelog_url="https://github.com/${safe_repo}/compare/${last_tag}...${new_tag}"
          else
            full_changelog_url="https://github.com/${safe_repo}/releases/tag/${new_tag}"
          fi

          echo "full_changelog_url: $full_changelog_url"

          safe_new_tag="$(printf '%s' "$new_tag" | tr -d '\n\r')"
          safe_last_tag="$(printf '%s' "$last_tag" | tr -d '\n\r')"
          safe_full_changelog_url="$(printf '%s' "$full_changelog_url" | tr -d '\n\r')"
          safe_is_prerelease="$(printf '%s' "$is_prerelease" | tr -d '\n\r')"

          echo "new_tag=${safe_new_tag}" >> "$GITHUB_OUTPUT"
          echo "last_tag=${safe_last_tag}" >> "$GITHUB_OUTPUT"
          echo "full_changelog_url=${safe_full_changelog_url}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${safe_is_prerelease}" >> "$GITHUB_OUTPUT"

      # generate release notes content using conventional changelog cli and create GitHub release via GH CLI
      - name: Generate Release via CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ steps.prep_release.outputs.is_prerelease }}
          FULL_CHANGELOG_URL: ${{ steps.prep_release.outputs.full_changelog_url }}
          NEW_TAG: ${{ steps.prep_release.outputs.new_tag }}
        run: |
          set -euo pipefail

          changelog_content="$(npx -y conventional-changelog \
            -p conventionalcommits \
            -n changelog.config.mjs \
            --stdout -u -r 1 -i /dev/null \
            | sed -n '/^### /,$p')"
          echo "changelog_content: $changelog_content"

          if [[ -z "$changelog_content" ]]; then
            changelog_content="$(npx -y conventional-changelog \
              -p conventionalcommits \
              -n changelog.config.mjs \
              --stdout -u -r 2 -i /dev/null \
              | sed -n '/^### /,$p')"
          fi
          echo "FALLBACK changelog_content: $changelog_content"

          if [[ -z "$changelog_content" ]]; then
              echo "No changelog content generated. Exiting."
              exit 1
          fi

          prerelease_flag=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi

          {
            echo "## What's Changed"
            echo
            echo "$changelog_content"
            echo
            echo "**Full Changelog:** $FULL_CHANGELOG_URL"
          } | gh release create "$NEW_TAG" -t "$NEW_TAG" "${prerelease_flag[@]}" -F -
