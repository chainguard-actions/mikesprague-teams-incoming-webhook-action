name: Test custom options - color and title-size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server
        run: |
          python3 -c "
          import http.server

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'1')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9998), Handler)
          server.serve_forever()
          " &
          sleep 1
          echo "Mock server started on port 9998"

      - name: Test with success color and Large title
        id: action-success
        uses: .
        with:
          github-token: ${{ github.token }}
          webhook-url: "http://127.0.0.1:9998/webhook"
          title: "Deployment Succeeded"
          title-size: "Large"
          message: "All systems go!"
          color: "success"
          timezone: "America/Chicago"

      - name: Assert success color action completed
        run: |
          echo "Action with success color and Large title completed successfully"
          echo "PASS"

      - name: Test with failure color
        id: action-failure
        uses: .
        with:
          github-token: ${{ github.token }}
          webhook-url: "http://127.0.0.1:9998/webhook"
          title: "Deployment Failed"
          title-size: "Default"
          message: "Something went wrong."
          color: "failure"

      - name: Assert failure color action completed
        run: |
          echo "Action with failure color completed successfully"
          echo "PASS"

      - name: Test with warning color
        id: action-warning
        uses: .
        with:
          github-token: ${{ github.token }}
          webhook-url: "http://127.0.0.1:9998/webhook"
          title: "Warning Notice"
          color: "warning"
          message: "Please review this warning."

      - name: Assert warning color action completed
        run: |
          echo "Action with warning color completed successfully"
          echo "PASS"
