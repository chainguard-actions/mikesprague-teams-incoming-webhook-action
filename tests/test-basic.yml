name: Test basic usage - simple notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server
        run: |
          # Start a simple HTTP server that returns 1 (Teams success response) for any POST
          python3 -c "
          import http.server, json, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'1')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9999), Handler)
          server.serve_forever()
          " &
          # Wait for server to be ready
          sleep 1
          echo "Mock server started on port 9999"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          webhook-url: "http://127.0.0.1:9999/webhook"
          title: "Test Notification"
          message: "This is a basic test notification"

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully"
          echo "PASS"
