name: Test invalid webhook URL - action should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with invalid webhook URL
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          webhook-url: "http://127.0.0.1:19999/nonexistent"
          title: "Test Notification"
          message: "This should fail because the webhook URL is invalid"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid webhook URL, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid webhook URL"
