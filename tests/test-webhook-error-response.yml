name: Test webhook error response - action should fail on non-200
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server that returns 400
        run: |
          python3 -c "
          import http.server

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(400)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'Bad Request')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9996), Handler)
          server.serve_forever()
          " &
          sleep 1
          echo "Mock error server started on port 9996"

      - name: Test with webhook returning 400 error
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          webhook-url: "http://127.0.0.1:9996/webhook"
          title: "Test Notification"
          message: "This should fail because the webhook returns 400"

      - name: Assert action failed on bad webhook response
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when webhook returns 400, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when webhook returned an error response"
