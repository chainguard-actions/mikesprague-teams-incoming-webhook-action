name: Test deploy card notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          webhook-url: "https://example.webhook.office.com/webhookb2/fake-webhook-url"
          title: "Deploy Notification"
          deploy-card: true
          show-commit-message: true
          timezone: "America/New_York"
      - name: Assert action ran and failed gracefully (no real webhook)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real webhook available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real webhook URL available in test harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
